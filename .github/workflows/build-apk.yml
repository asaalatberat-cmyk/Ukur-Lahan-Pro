name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK (Ukur Lahan Pro + ASA Laporan)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :laporan:assembleDebug --no-daemon --stacktrace
      - name: Kumpulkan APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/UkurLahanPro.apk
          cp laporan/build/outputs/apk/debug/laporan-debug.apk apk/ASA-Laporan.apk
      - uses: actions/upload-artifact@v4
        with:
          name: APK-ASA-Earthwork
          path: apk/*.apk
